# ---------------------------------------------------------------------------
# Build system
# ---------------------------------------------------------------------------

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------

[project.urls]
Homepage = "https://github.com/username/project_name"
Repository = "https://github.com/username/project_name"
Issues = "https://github.com/username/project_name/issues"

[project]
name = "project_name"
version = "0.1.0"
description = "A short description of project_name."
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["project_name"]
requires-python = ">=3.15"

# ---------------------------------------------------------------------------
# Project dependencies
# ---------------------------------------------------------------------------

# Runtime dependencies for end users of the library/CLI.
# Keep this stub even when empty so adding first-party requirements is obvious.
dependencies = []

# Runtime optional dependencies for end users of the library/CLI.
#[project.optional-dependencies]
#<optional-dependency-name-1> = []
#<optional-dependency-name-2> = []

# Dependency groups (PEP 735) - preferred modern workflow for local/dev tooling.
# These are not published as installable extras for downstream users.
[dependency-groups]
dev = [
  "pre-commit>=4.2",
  "pytest>=8.3",
  "pytest-cov>=6.1",
  "ruff>=0.11",
  "ty>=0.0.1a8",
]

# ---------------------------------------------------------------------------
# Project scripts (entry points)
# ---------------------------------------------------------------------------

[project.scripts]
project_name = "project_name.cli:main"

#[project.gui-scripts]
#project_name_gui = "project_name.gui:main"

# ---------------------------------------------------------------------------
# Hatch build config (src layout)
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/project_name"]

# ---------------------------------------------------------------------------
# Ruff - linting + formatting (replaces black, isort, flake8, pylint)
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py315"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # Absense of trailing comma is OK since formatter automatically adds them when needed.
  "CPY001", # Allow files to not have a copyright statement. Remove this if your organization requires them.
  "D203",   # Conflicts with D211.
  "D213",   # Conflicts with D212.
  "FIX002", # Allow TODO comments without requiring immediate resolution.
  "S311",   # Allow `random` module usage for non-cryptographic purposes.
  "T201",   # Allow print statements. They are used in the CLI and for debugging.
  "TD",     # Allow TODO format/link/author variations globally.
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "ARG001",  # Allow unused arguments in functions (e.g., fixtures).
  "ARG002",  # Allow unused arguments in methods (e.g., fixtures).
  "ARG005",  # Allow unused arguments in class methods (e.g., fixtures).
  "D1",      # Ignore docstring rules related to public modules, classes, methods, functions, etc.
  "INP001",  # Tests don't need to be part of a package.
  "PLR2004", # Magic values are often fine in tests.
  "SLF001",  # Tests often need access to private members.
  "S101",    # Plain assert is standard Pytest style.
]

[tool.ruff.lint.isort]
known-first-party = ["project_name"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ---------------------------------------------------------------------------
# ty - type checker (Astral)
# ---------------------------------------------------------------------------

[tool.ty.environment]
root = ["src"]

[tool.ty.rules]
# Enable strictest available rules
all = "error"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
  "--cov=project_name",
  "--cov-report=term-missing",
  "--cov-report=html:htmlcov",
  "--cov-fail-under=80",
]
xfail_strict = true

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["src/project_name"]
branch = true
omit = ["*/cli.py"]           # CLI tested via integration; adjust as needed

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "@(abc\\.)?abstractmethod",
]
